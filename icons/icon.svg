<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kare -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Belge Sayfası -->
  <g filter="url(#shadow)">
    <!-- Sayfa Gövdesi -->
    <path d="M140 100 H310 L380 170 V400 C380 411.046 371.046 420 360 420 H140 C128.954 420 120 411.046 120 400 V120 C120 108.954 128.954 100 140 100 Z" fill="url(#sheetGrad)"/>
    <!-- Sayfa Köşe Katlaması -->
    <path d="M310 100 V160 C310 165.523 314.477 170 320 170 H380 Z" fill="#cbd5e1"/>
  </g>

  <!-- PDF Rozeti (Kırmızı Kavisli Çubuk) -->
  <rect x="156" y="220" width="130" height="42" rx="8" fill="#ef4444"/>
  <text x="221" y="249" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PDF</text>

  <!-- Belge Satırları -->
  <rect x="156" y="290" width="190" height="14" rx="7" fill="#94a3b8"/>
  <rect x="156" y="320" width="150" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="156" y="350" width="180" height="14" rx="7" fill="#cbd5e1"/>

  <!-- Düzenleme / Kalem İkonu -->
  <circle cx="370" cy="370" r="54" fill="#10b981" filter="url(#shadow)"/>
  <path d="M356 384 L384 356 M352 388 L354 378 L380 352 C382.2 349.8 385.8 349.8 388 352 C390.2 354.2 390.2 357.8 388 360 L362 386 L352 388 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
